<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>VPS 現場位置合わせ＆柱オクルージョン</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; background: #000; }
    #camera-video {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      object-fit: cover; z-index: 0;
    }
    a-scene {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1;
    }
    #hud {
      position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
      width: 94%; max-width: 440px; z-index: 9999;
      background: rgba(15, 23, 42, 0.9); color: #fff;
      padding: 10px 12px; border-radius: 12px; border: 1px solid #38bdf8;
      font-size: 11px; line-height: 1.4;
    }
    #status-badge {
      display: inline-block; padding: 2px 8px; border-radius: 8px;
      background: #f59e0b; color: #000; font-weight: bold;
    }
    .btn-row { display: flex; gap: 5px; margin-top: 6px; flex-wrap: wrap; }
    button {
      padding: 6px 8px; border: none; border-radius: 6px;
      font-weight: bold; font-size: 11px; cursor: pointer;
    }
    #scan-btn { flex: 1; background: #10b981; color: white; }
    #toggle-occ-btn { background: #ef4444; color: white; }
    #target-btn { background: #8b5cf6; color: white; }

    /* 位置微調整パッド（画面下） */
    #pad {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
      width: 94%; max-width: 440px; z-index: 9999;
      background: rgba(15, 23, 42, 0.9); color: #fff;
      padding: 10px; border-radius: 12px; border: 1px solid #64748b;
      font-size: 11px;
    }
    .pad-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 6px;
    }
    .pad-grid button { background: #334155; color: #fff; padding: 8px 4px; }
    #pos-readout { color: #38bdf8; font-family: monospace; margin-top: 4px; font-size: 11px; }
  </style>
</head>
<body>

  <video id="camera-video" autoplay playsinline muted></video>
  <canvas id="capture-canvas" style="display:none;"></canvas>

  <!-- 上部ステータス -->
  <div id="hud">
    <div><span id="status-badge">スキャン待機中</span> <span id="coord-text">柱を写して認識ボタンを押してください</span></div>
    <div class="btn-row">
      <button id="scan-btn" onclick="localizeOnce()">📷 1回認識して固定</button>
      <button id="toggle-occ-btn" onclick="toggleOcclusionMode()">柱: 赤表示中</button>
    </div>
  </div>

  <!-- 下部 現場微調整パッド -->
  <div id="pad">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span>動かす対象：</span>
      <button id="target-btn" onclick="switchTarget()">現在：🟥 赤い柱を移動中</button>
    </div>
    <div class="pad-grid">
      <button onclick="moveObj(-0.2, 0, 0)">⬅ 左へ</button>
      <button onclick="moveObj(0.2, 0, 0)">➡ 右へ</button>
      <button onclick="moveObj(0, 0, -0.2)">⬆ 奥へ</button>
      <button onclick="moveObj(0, 0, 0.2)">⬇ 手前へ</button>
      <button onclick="moveObj(0, 0.2, 0)">🔼 上へ</button>
      <button onclick="moveObj(0, -0.2, 0)">🔽 下へ</button>
      <button onclick="resizePillar(0.1)">柱 太く+</button>
      <button onclick="resizePillar(-0.1)">柱 細く-</button>
    </div>
    <div id="pos-readout">柱: x=0.0, y=0.0, z=-2.0 | キャラ: x=0.4, y=-0.8, z=-2.8</div>
  </div>

  <a-scene embedded vr-mode-ui="enabled: false" renderer="alpha: true;">
    <a-assets>
      <a-asset-item id="chara-model" src="maya/kougyo2.glb"></a-asset-item>
    </a-assets>

    <a-entity light="type: ambient; color: #ffffff; intensity: 1.8;"></a-entity>
    <a-entity light="type: directional; color: #ffffff; intensity: 1.0;" position="1 2 1"></a-entity>

    <a-camera id="ar-camera" position="0 0 0" look-controls="touchEnabled: false"></a-camera>

    <a-entity id="vps-world-root" visible="false">
      <!-- ① 柱のオクルージョン用ボックス -->
      <a-box
        id="pillar-occluder"
        position="0 0 -2.0"
        width="0.6"
        height="3.0"
        depth="0.6"
        material="color: #ef4444; opacity: 0.45; transparent: true;">
      </a-box>

      <!-- ② キャラクター -->
      <a-entity
        id="chara-entity"
        gltf-model="#chara-model"
        scale="0.08 0.08 0.08"
        position="0.4 -0.8 -2.8"
        rotation="0 0 0"
        animation-mixer>
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    // ==========================================
    const DEVELOPER_TOKEN = "64e94096aa570f86962c78e6804785f377c45317b8f1c5836c3470c73f3d105f";
    const MAP_ID = 153610; // あなたのMap IDに書き換え
    // ==========================================

    const video = document.getElementById('camera-video');
    const canvas = document.getElementById('capture-canvas');
    const statusBadge = document.getElementById('status-badge');
    const coordText = document.getElementById('coord-text');
    const vpsWorldRoot = document.getElementById('vps-world-root');
    const pillarOccluder = document.getElementById('pillar-occluder');
    const charaEntity = document.getElementById('chara-entity');
    const toggleOccBtn = document.getElementById('toggle-occ-btn');
    const targetBtn = document.getElementById('target-btn');
    const posReadout = document.getElementById('pos-readout');

    let isTransparentOcclusion = false;
    let editTarget = 'pillar'; // 'pillar' or 'chara'

    function switchTarget() {
      if (editTarget === 'pillar') {
        editTarget = 'chara';
        targetBtn.textContent = "現在：🧍 キャラを移動中";
        targetBtn.style.background = "#0284c7";
      } else {
        editTarget = 'pillar';
        targetBtn.textContent = "現在：🟥 赤い柱を移動中";
        targetBtn.style.background = "#8b5cf6";
      }
    }

    function moveObj(dx, dy, dz) {
      const el = (editTarget === 'pillar') ? pillarOccluder : charaEntity;
      const pos = el.getAttribute('position');
      el.setAttribute('position', {
        x: Number((pos.x + dx).toFixed(2)),
        y: Number((pos.y + dy).toFixed(2)),
        z: Number((pos.z + dz).toFixed(2))
      });
      updateReadout();
    }

    function resizePillar(delta) {
      const w = Math.max(0.1, Number((Number(pillarOccluder.getAttribute('width')) + delta).toFixed(2)));
      const d = Math.max(0.1, Number((Number(pillarOccluder.getAttribute('depth')) + delta).toFixed(2)));
      pillarOccluder.setAttribute('width', w);
      pillarOccluder.setAttribute('depth', d);
      updateReadout();
    }

    function updateReadout() {
      const p = pillarOccluder.getAttribute('position');
      const c = charaEntity.getAttribute('position');
      const w = pillarOccluder.getAttribute('width');
      posReadout.textContent = `柱(幅${w}): x=${p.x}, y=${p.y}, z=${p.z} | キャラ: x=${c.x}, y=${c.y}, z=${c.z}`;
    }

    function toggleOcclusionMode() {
      isTransparentOcclusion = !isTransparentOcclusion;
      const mesh = pillarOccluder.getObject3D('mesh');

      if (isTransparentOcclusion) {
        if (mesh && mesh.material) {
          mesh.material.colorWrite = false;
          mesh.material.transparent = false;
          mesh.material.opacity = 1.0;
          mesh.material.needsUpdate = true;
        }
        toggleOccBtn.textContent = "柱: 透明隠れ中";
        toggleOccBtn.style.background = "#3b82f6";
      } else {
        if (mesh && mesh.material) {
          mesh.material.colorWrite = true;
          mesh.material.color.set('#ef4444');
          mesh.material.transparent = true;
          mesh.material.opacity = 0.45;
          mesh.material.needsUpdate = true;
        }
        toggleOccBtn.textContent = "柱: 赤表示中";
        toggleOccBtn.style.background = "#ef4444";
      }
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        coordText.textContent = "カメラ起動エラー: " + err.message;
      }
    }
    startCamera();

    async function localizeOnce() {
      if (!video.videoWidth) return;
      statusBadge.textContent = "照合中...";
      statusBadge.style.background = "#38bdf8";

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const base64Image = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];

      const focal = Math.max(canvas.width, canvas.height) * 0.8;
      const payload = {
        token: DEVELOPER_TOKEN,
        fx: focal, fy: focal,
        ox: canvas.width / 2, oy: canvas.height / 2,
        b64: base64Image,
        mapIds: [{ id: MAP_ID }]
      };

      try {
        const res = await fetch("https://api.immersal.com/localizeb64", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.error === "none" && data.success) {
          statusBadge.textContent = "✅ 認識成功";
          statusBadge.style.background = "#10b981";
          statusBadge.style.color = "#fff";
          coordText.textContent = "下のボタンで赤い柱を現実の柱に重ねてください";

          applyImmersalTransform(data);
          vpsWorldRoot.setAttribute('visible', true);
        } else {
          statusBadge.textContent = "未検出";
          statusBadge.style.background = "#ef4444";
          coordText.textContent = "理由: " + (data.error || "特徴点不一致");
        }
      } catch (e) {
        coordText.textContent = "通信エラー: " + e.message;
      }
    }

    function applyImmersalTransform(data) {
      const cam = document.getElementById('ar-camera').object3D;
      const m = new THREE.Matrix4();
      m.set(
        data.r00, data.r01, data.r02, data.px,
        data.r10, data.r11, data.r12, data.py,
        data.r20, data.r21, data.r22, data.pz,
        0,        0,        0,        1
      );
      const flipZ = new THREE.Matrix4().makeScale(1, 1, -1);
      const mapToCam = new THREE.Matrix4().multiplyMatrices(flipZ, m).multiply(flipZ);
      const camToMap = mapToCam.clone().invert();

      cam.updateMatrixWorld();
      const worldMatrix = new THREE.Matrix4().multiplyMatrices(cam.matrixWorld, camToMap);

      const pos = new THREE.Vector3();
      const quat = new THREE.Quaternion();
      const scale = new THREE.Vector3();
      worldMatrix.decompose(pos, quat, scale);

      vpsWorldRoot.object3D.position.copy(pos);
      vpsWorldRoot.object3D.quaternion.copy(quat);
    }
  </script>
</body>
</html>
