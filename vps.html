<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Immersal 動画スキャンマップ 1マップテスト</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; font-family: sans-serif; background: #000; }

    #camera-video {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      object-fit: cover; z-index: 0;
    }
    a-scene {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1;
    }

    /* 上部ステータス表示 */
    #hud {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
      width: 92%; max-width: 400px; z-index: 9999;
      background: rgba(15, 23, 42, 0.9); color: #fff;
      padding: 12px 14px; border-radius: 14px; border: 2px solid #f59e0b;
      font-size: 12px; line-height: 1.4;
      transition: border-color 0.2s;
    }
    .hud-top {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    #status-badge {
      padding: 5px 12px; border-radius: 10px;
      background: #f59e0b; color: #000; font-weight: bold; font-size: 13px;
    }
    #scan-btn {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff; border: none; border-radius: 8px;
      padding: 7px 12px; font-weight: bold; font-size: 12px; cursor: pointer;
    }
    #recognition-banner {
      display: none;
      margin-top: 8px; padding: 6px 10px; border-radius: 8px;
      background: rgba(16, 185, 129, 0.25); border: 1px solid #10b981;
      color: #6ee7b7; font-weight: bold; font-size: 14px; text-align: center;
    }
    #coord-text {
      margin-top: 6px; color: #cbd5e1;
    }
  </style>
</head>
<body>

  <video id="camera-video" autoplay playsinline muted></video>
  <canvas id="capture-canvas" style="display:none;"></canvas>

  <div id="hud">
    <div class="hud-top">
      <span id="status-badge">スキャン待機中</span>
      <button id="scan-btn" onclick="toggleAutoTracking()">📷 テスト開始</button>
    </div>
    <div id="recognition-banner">🎉 認識できてる！</div>
    <div id="coord-text">新しい動画マップの場所にカメラを向けてください</div>
  </div>

  <a-scene embedded vr-mode-ui="enabled: false" renderer="alpha: true;">
    <a-assets>
      <a-asset-item id="chara-model" src="maya/kougyo2.glb"></a-asset-item>
    </a-assets>

    <a-entity light="type: ambient; color: #ffffff; intensity: 1.8;"></a-entity>
    <a-entity light="type: directional; color: #ffffff; intensity: 1.0;" position="1 2 1"></a-entity>

    <a-camera id="ar-camera" position="0 0 0" look-controls="touchEnabled: false"></a-camera>

    <!-- 空間固定ルート -->
    <a-entity id="vps-world-root" visible="false">
      <a-entity
        id="chara-entity"
        gltf-model="#chara-model"
        scale="0.08 0.08 0.08"
        position="0 -0.8 -2.2"
        rotation="0 0 0"
        animation-mixer>
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    // ==========================================
    // ★ ここにトークンと、動画で撮った新しいMap IDを1つだけ入力
    // ==========================================
    const DEVELOPER_TOKEN = "64e94096aa570f86962c78e6804785f377c45317b8f1c5836c3470c73f3d105f";
    const MAP_ID = 153798; // ← 新しい動画マップのIDに書き換えてください
    // ==========================================

    const video = document.getElementById('camera-video');
    const canvas = document.getElementById('capture-canvas');
    const hud = document.getElementById('hud');
    const statusBadge = document.getElementById('status-badge');
    const recognitionBanner = document.getElementById('recognition-banner');
    const coordText = document.getElementById('coord-text');
    const scanBtn = document.getElementById('scan-btn');
    const vpsWorldRoot = document.getElementById('vps-world-root');

    let trackingTimer = null;
    let isRequesting = false;

    // 背面カメラ起動
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        coordText.textContent = "カメラ起動エラー: " + err.message;
      }
    }
    startCamera();

    // 追跡開始・停止
    function toggleAutoTracking() {
      if (trackingTimer) {
        clearInterval(trackingTimer);
        trackingTimer = null;
        scanBtn.textContent = "📷 テスト開始";
        scanBtn.style.background = "linear-gradient(135deg, #10b981, #059669)";
        statusBadge.textContent = "停止中";
        statusBadge.style.background = "#f59e0b";
        statusBadge.style.color = "#000";
        recognitionBanner.style.display = "none";
        hud.style.borderColor = "#f59e0b";
      } else {
        scanBtn.textContent = "⏹ 停止";
        scanBtn.style.background = "#64748b";
        localizeOnce();
        trackingTimer = setInterval(localizeOnce, 1500);
      }
    }

    async function localizeOnce() {
      if (!video.videoWidth || isRequesting) return;
      isRequesting = true;

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const base64Image = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];

      const focal = Math.max(canvas.width, canvas.height) * 0.8;
      const payload = {
        token: DEVELOPER_TOKEN,
        fx: focal,
        fy: focal,
        ox: canvas.width / 2,
        oy: canvas.height / 2,
        b64: base64Image,
        mapIds: [{ id: MAP_ID }] // 1マップのみ指定
      };

      try {
        const res = await fetch("https://api.immersal.com/localizeb64", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.error === "none" && data.success) {
          hud.style.borderColor = "#10b981";
          statusBadge.textContent = "✅ 認識できてる！";
          statusBadge.style.background = "#10b981";
          statusBadge.style.color = "#fff";

          recognitionBanner.style.display = "block";
          recognitionBanner.textContent = `🎉 認識できてる！（ID: ${MAP_ID}）`;

          const px = data.px.toFixed(2);
          const py = data.py.toFixed(2);
          const pz = data.pz.toFixed(2);
          coordText.textContent = `X=${px}m, Y=${py}m, Z=${pz}m`;

          applyImmersalTransform(data);
          vpsWorldRoot.setAttribute('visible', true);
        } else {
          hud.style.borderColor = "#f59e0b";
          statusBadge.textContent = "🔍 探索中...";
          statusBadge.style.background = "#f59e0b";
          statusBadge.style.color = "#000";

          recognitionBanner.style.display = "none";
          coordText.textContent = "特徴点を探しています（ゆっくりかざしてください）";
        }
      } catch (e) {
        coordText.textContent = "通信エラー: " + e.message;
      } finally {
        isRequesting = false;
      }
    }

    function applyImmersalTransform(data) {
      const cam = document.getElementById('ar-camera').object3D;
      const m = new THREE.Matrix4();
      m.set(
        data.r00, data.r01, data.r02, data.px,
        data.r10, data.r11, data.r12, data.py,
        data.r20, data.r21, data.r22, data.pz,
        0,        0,        0,        1
      );
      const flipZ = new THREE.Matrix4().makeScale(1, 1, -1);
      const mapToCam = new THREE.Matrix4().multiplyMatrices(flipZ, m).multiply(flipZ);
      const camToMap = mapToCam.clone().invert();

      cam.updateMatrixWorld();
      const worldMatrix = new THREE.Matrix4().multiplyMatrices(cam.matrixWorld, camToMap);

      const pos = new THREE.Vector3();
      const quat = new THREE.Quaternion();
      const scale = new THREE.Vector3();
      worldMatrix.decompose(pos, quat, scale);

      vpsWorldRoot.object3D.position.copy(pos);
      vpsWorldRoot.object3D.quaternion.copy(quat);
    }
  </script>
</body>
</html>
